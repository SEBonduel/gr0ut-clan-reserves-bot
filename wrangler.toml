name = "gr0ut-clan-reserves"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Stockage du token WG (créé via : wrangler kv namespace create TOKENS)
# Colle l'id renvoyé ci-dessous.
[[kv_namespaces]]
binding = "TOKENS"
id = "e8d3f6a1a0ab41bbbe46b8bd0ebe1cf7"

# 06:00 UTC : renouvellement des tokens WG. Toutes les 30 min le soir (16-22 UTC) :
# détection des réserves activables (notif Discord) ET, le samedi, rappel "Jeux de
# guerre" (le code ne poste qu'à 19h Paris, une seule fois : gère été/hiver et évite
# les collisions de crons). Pas de cron dédié au rappel pour cette raison.
[triggers]
crons = ["0 6 * * *", "*/30 16-22 * * *"]

# Variables NON secrètes. Les secrets se posent avec `wrangler secret put NOM` :
#   WG_APP_ID, DISCORD_PUBLIC_KEY, DISCORD_TOKEN, DISCORD_APP_ID,
#   OFFICER_ROLE_IDS (id séparés par des virgules), CLAN_ID, LOGIN_SECRET
[vars]
WG_REGION = "eu"
